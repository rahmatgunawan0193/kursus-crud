<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Kursus | Kursus Online</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Kursus Online</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Admin</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">
  <div class="row g-4">
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="ratio ratio-16x9 bg-secondary-subtle"><div class="d-flex align-items-center justify-content-center text-secondary">Foto kursus</div></div>
        <div class="card-body">
          <h1 class="h4">PHP dan MySQL untuk Pemula</h1>
          <p class="text-muted small">Mulai: 8 Desember 2026</p>
          <p class="mb-0">Membuat aplikasi web dinamis dengan PHP dan MySQL, lengkap dengan operasi CRUD.</p>
        </div>
      </div>
    </div>
    <div class="col-lg-7">
      <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">Formulir Pendaftaran</div>
        <div class="card-body">
          <form>
            <div class="mb-3"><label class="form-label" for="fullname">Nama Lengkap</label><input type="text" class="form-control" id="fullname" required></div>
            <div class="mb-3"><label class="form-label" for="phone">Nomor Telepon</label><input type="tel" class="form-control" id="phone" required></div>
            <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" required></div>
            <button type="submit" class="btn btn-primary">Daftar</button>
            <a href="index.html" class="btn btn-outline-secondary">Kembali</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
