<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Kursus | Kursus Online</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="dashboard.html">Kursus Online &middot; Admin</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Kursus</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Keluar</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">
  <div class="row justify-content-center"><div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">Tambah / Edit Kursus</div>
      <div class="card-body">
        <form>
          <div class="mb-3"><label class="form-label" for="name_course">Nama Kursus</label><input type="text" class="form-control" id="name_course" maxlength="50" required></div>
          <div class="mb-3"><label class="form-label" for="descript_course">Deskripsi</label><textarea class="form-control" id="descript_course" rows="4" required></textarea></div>
          <div class="mb-3"><label class="form-label" for="date_course">Tanggal Mulai</label><input type="date" class="form-control" id="date_course" required></div>
          <div class="mb-3"><label class="form-label" for="photo_course">Foto Kursus</label><input type="file" class="form-control" id="photo_course" accept="image/jpeg,image/png,image/gif"><div class="form-text">Format JPG, PNG, atau GIF. Maksimal 2 MB.</div></div>
          <button type="submit" class="btn btn-primary">Simpan</button>
          <a href="dashboard.html" class="btn btn-outline-secondary">Batal</a>
        </form>
      </div>
    </div>
  </div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
