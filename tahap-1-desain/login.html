<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin | Kursus Online</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Kursus Online</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Admin</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-5">
  <div class="row justify-content-center"><div class="col-md-6 col-lg-4">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3 text-center">Login Admin</h1>
      <div class="alert alert-danger">Username atau password salah. (contoh tampilan pesan error)</div>
      <form>
        <div class="mb-3"><label class="form-label" for="username">Username</label><input type="text" class="form-control" id="username" required></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password" required></div>
        <div class="d-grid"><a href="dashboard.html" class="btn btn-primary">Masuk</a></div>
      </form>
    </div></div>
  </div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
